name: Docs Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'src/main/resources/**'
      - 'src/main/java/site/mcrelicworld/relicprison/api/**'
      - 'src/main/java/site/mcrelicworld/relicprison/command/**'
      - 'docs/CURRENT_STATE.md'
      - 'CHANGELOG.md'
      - 'pom.xml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'wiki/**'
      - 'src/main/resources/**'
      - 'src/main/java/site/mcrelicworld/relicprison/api/**'
      - 'src/main/java/site/mcrelicworld/relicprison/command/**'
      - 'docs/CURRENT_STATE.md'
      - 'CHANGELOG.md'
      - 'pom.xml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documentation dependencies
        working-directory: wiki
        run: npm install --no-audit --no-fund
      - name: Generate and build documentation
        working-directory: wiki
        env:
          DOCS_BASE: /RelicPrison/
        run: npm run docs:build
      - name: Upload documentation build artifact
        uses: actions/upload-artifact@v4
        with:
          name: relicprison-docs-site
          path: wiki/.vitepress/dist
          if-no-files-found: error
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
