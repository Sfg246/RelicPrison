name: Paper Compatibility Probe

on:
  push:
    branches:
      - compat/paper-version-matrix
    paths:
      - '.github/workflows/compat-paper-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    name: Paper ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        minecraft:
          - '26.2'
          - '26.1.2'
          - '26.1.1'
          - '1.21.11'
          - '1.21.10'
          - '1.21.9'
          - '1.21.8'
          - '1.21.7'
          - '1.21.6'
          - '1.21.5'
          - '1.21.4'
          - '1.21.3'
          - '1.21.1'
          - '1.21'
          - '1.20.6'

    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download latest stable Paper build and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          VERSION='${{ matrix.minecraft }}'
          USER_AGENT='RelicPrisonCompatibilityProbe/1.0 (https://github.com/Sfg246/RelicPrison)'

          BUILD_JSON="$(curl --fail --retry 3 --retry-delay 2 -sS -H "User-Agent: ${USER_AGENT}" \
            "https://fill.papermc.io/v3/projects/paper/versions/${VERSION}/builds/latest")"
          PAPER_BUILD="$(jq -r '.id' <<<"${BUILD_JSON}")"
          PAPER_CHANNEL="$(jq -r '.channel' <<<"${BUILD_JSON}")"
          PAPER_URL="$(jq -r '.downloads["server:default"].url' <<<"${BUILD_JSON}")"
          PAPER_SHA="$(jq -r '.downloads["server:default"].checksums.sha256' <<<"${BUILD_JSON}")"
          PAPER_NAME="$(jq -r '.downloads["server:default"].name' <<<"${BUILD_JSON}")"

          if [[ -z "${PAPER_URL}" || "${PAPER_URL}" == 'null' ]]; then
            echo "No Paper server download found for ${VERSION}" >&2
            exit 1
          fi

          echo "Paper ${VERSION} build ${PAPER_BUILD} (${PAPER_CHANNEL}) -> ${PAPER_NAME}"
          curl --fail --retry 3 --retry-delay 2 -L -o server/paper.jar "${PAPER_URL}"
          echo "${PAPER_SHA}  server/paper.jar" | sha256sum -c -

          curl --fail --retry 3 --retry-delay 2 -L \
            -o server/plugins/RelicPrison-1.0.0.jar \
            'https://github.com/Sfg246/RelicPrison/releases/download/v1.0.0/RelicPrison-1.0.0.jar'
          echo '38a95ddbc642af7ca02d22dc439e41cadaf5f8c9f980c196c4769b776611d912  server/plugins/RelicPrison-1.0.0.jar' | sha256sum -c -

          curl --fail --retry 3 --retry-delay 2 -L \
            -o server/plugins/Vault.jar \
            'https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar'
          curl --fail --retry 3 --retry-delay 2 -L \
            -o server/plugins/LuckPerms.jar \
            'https://download.luckperms.net/1581/bukkit/loader/LuckPerms-Bukkit-5.4.164.jar'
          curl --fail --retry 3 --retry-delay 2 -L \
            -o server/plugins/EssentialsX.jar \
            'https://repo.essentialsx.net/releases/net/essentialsx/EssentialsX/2.22.0/EssentialsX-2.22.0.jar'

          printf 'eula=true\n' > server/eula.txt
          cat > server/server.properties <<'PROPS'
          online-mode=false
          enforce-secure-profile=false
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-players=1
          motd=RelicPrison compatibility probe
          PROPS

          cat > server/probe-meta.txt <<META
          minecraft=${VERSION}
          paper_build=${PAPER_BUILD}
          paper_channel=${PAPER_CHANNEL}
          paper_name=${PAPER_NAME}
          META

      - name: Boot exact RelicPrison 1.0.0 release
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          cd server
          : > console.log

          java --enable-native-access=ALL-UNNAMED -Xms512M -Xmx1536M -jar paper.jar --nogui >console.log 2>&1 &
          PID=$!
          READY=0
          PROCESS_EXITED=0

          for _ in $(seq 1 180); do
            if grep -Eqi 'Status[[:space:]]+READY|Ready\. All required systems initialized successfully\.|RelicPrison 1\.0\.0 READY' console.log logs/latest.log 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "${PID}" 2>/dev/null; then
              PROCESS_EXITED=1
              break
            fi
            sleep 1
          done

          if kill -0 "${PID}" 2>/dev/null; then
            kill -TERM "${PID}" 2>/dev/null || true
            for _ in $(seq 1 20); do
              kill -0 "${PID}" 2>/dev/null || break
              sleep 1
            done
            kill -KILL "${PID}" 2>/dev/null || true
          fi
          wait "${PID}" 2>/dev/null || true

          VERSION='${{ matrix.minecraft }}'
          PAPER_BUILD="$(sed -n 's/^paper_build=//p' probe-meta.txt)"
          PAPER_CHANNEL="$(sed -n 's/^paper_channel=//p' probe-meta.txt)"

          FAILURE_HINT=''
          if [[ "${READY}" -ne 1 ]]; then
            FAILURE_HINT="$(grep -Eim1 'Unsupported API version|UnsupportedClassVersionError|NoSuchMethodError|NoClassDefFoundError|ClassNotFoundException|Error occurred while enabling RelicPrison|RelicPrison could not|Could not load.*RelicPrison|Could not load plugin|InvalidPluginException|Disabling RelicPrison|Vault found no registered economy provider|LuckPerms' console.log 2>/dev/null || true)"
            if [[ -z "${FAILURE_HINT}" ]]; then
              FAILURE_HINT="$(tail -n 1 console.log 2>/dev/null || true)"
            fi
          fi

          {
            echo "# RelicPrison 1.0.0 compatibility probe"
            echo
            echo "- Minecraft/Paper version: ${VERSION}"
            echo "- Latest Paper build: ${PAPER_BUILD} (${PAPER_CHANNEL})"
            echo "- Java: $(java -version 2>&1 | head -n 1)"
            echo "- RelicPrison JAR SHA-256: $(sha256sum plugins/RelicPrison-1.0.0.jar | awk '{print $1}')"
            if [[ "${READY}" -eq 1 ]]; then
              echo "- Result: PASS - RelicPrison reached READY"
            else
              echo "- Result: FAIL - RelicPrison did not reach READY within the probe window"
              echo "- First failure hint: ${FAILURE_HINT}"
              echo "- Server process exited early: ${PROCESS_EXITED}"
            fi
          } > compatibility-result.md

          cat compatibility-result.md
          echo
          echo '--- RelicPrison / dependency log excerpts ---'
          grep -Ei 'RelicPrison|Vault|LuckPerms|Essentials|Unsupported API|NoSuchMethod|NoClassDef|ClassNotFound|InvalidPlugin|ERROR|SEVERE' console.log | tail -n 160 || true
          echo
          echo '--- final console tail ---'
          tail -n 100 console.log || true

          if [[ "${READY}" -eq 1 ]]; then
            echo 'ready=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'ready=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.minecraft }}-compatibility
          path: |
            server/compatibility-result.md
            server/console.log
            server/logs/latest.log
            server/probe-meta.txt
          if-no-files-found: ignore
          retention-days: 7
