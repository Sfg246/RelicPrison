config-version: 3

server:
  timezone: America/Chicago
  excluded-worlds:
    - Spawn
    - Minigames

startup:
  banner: true
  environment-details: true
  integration-summary: true

features:
  autosell: false
  autopickup: false
  autosmelt: false
  autoblock: false
  fortune: false
  custom-block-drops: false
  mining-xp: false
  block-events: false
  player-leaderboards: false
  # Approved per-player mining statistics. This is independent from mine-analytics.
  player-mining-statistics: true
  mine-analytics: false
  multiple-currencies: false
  reset-command-hooks: true
  update-checker: false

selection:
  session-timeout-seconds: 300
  preview-refresh-ticks: 20
  preview-max-particles: 600
  preview-spacing: 2
  maximum-volume: 250000
  allow-overlap: false
  wand-material: BLAZE_ROD

mine-resets:
  target-time-per-tick-ms: 2.5
  initial-blocks-per-tick: 1000
  min-blocks-per-tick: 100
  max-blocks-per-tick: 8000
  itemsadder:
    target-time-per-tick-ms: 1.0
    initial-blocks-per-tick: 100
    min-blocks-per-tick: 10
    max-blocks-per-tick: 1000
  max-concurrent-mines: 1
  per-world-concurrent-limits: {}
  empty-mine-trigger-enabled: true
  pause-above-mspt: 45.0
  resume-below-mspt: 35.0
  default-interval-seconds: 900
  default-mined-percentage: 80.0
  default-warning-seconds: [30, 10, 5, 3, 2, 1]
  runtime-save-interval-seconds: 30
  failure-retry-delay-seconds: 60
  notifications:
    chat: true
    title: true
    action-bar: true
    sound: true
    warning-sound: BLOCK_NOTE_BLOCK_PLING
    completion-sound: ENTITY_PLAYER_LEVELUP
    failure-sound: ENTITY_VILLAGER_NO

mine-access:
  allow-previous-mines: true
  enforce-entry: true

teleport:
  warmup-seconds: 3
  cancel-on-move: true
  cancel-on-damage: true

first-join:
  teleport-to-starting-mine: true
  # Commands run once for a brand-new profile. Supported: %player%, %uuid%, %rank%.
  commands: []

progression:
  starting-rank: a
  rank-group-format: '{rank}'
  prestige-group-format: '{prestige}'
  broadcast-rankups: false
  broadcast-prestiges: true
  prestige-confirmation-seconds: 30
  repair-on-join: true
  notifications:
    title: true
    sound: true
    rankup-sound: ENTITY_PLAYER_LEVELUP
    prestige-sound: UI_TOAST_CHALLENGE_COMPLETE

logging:
  debug: false
  categories:
    startup: false
    config: false
    database: false
    mines: false
    reset: false
    progression: false
    economy: false
    selling: false
    mining: false
    integration: false
    migration: false
    backup: false
    diagnostic: false

formatting:
  currency-symbol: '$'
  decimals: 2
  abbreviated-decimals: 2
  use-grouping: true
  abbreviations: [K, M, B, T, Qa, Qi, Sx, Sp, Oc, No, Dc]
  progress-bar:
    length: 10
    filled: '█'
    empty: '░'

placeholders:
  # Value placeholders share the same sell services as /sellvalue and never mutate inventory.
  value-cache-millis: 250
  leaderboard-cache-millis: 30000
  slow-threshold-millis: 10
  unavailable-text: loading
  malformed-text: invalid

gui:
  security:
    click-cooldown-millis: 250
    session-timeout-seconds: 120
    confirmation-timeout-seconds: 15

leaderboards:
  # Reads are served from async cached snapshots; placeholders never query SQL synchronously.
  refresh-seconds: 60
  snapshot-size: 100
  page-size: 45
  season:
    enabled: false
    id: season-1
    start: '2026-01-01T00:00:00Z'
    end: '2027-01-01T00:00:00Z'
  rewards:
    retry-limit: 3
    command-limit-per-period: 128
    announcement-cooldown-seconds: 30
